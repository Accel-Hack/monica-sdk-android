name: Maven release

# pom.xml を X.Y.Z-SNAPSHOT へ更新して main へ merge した後、
# vX.Y.Z tag をその commit へ付けるとこの repository の GitHub Packages へ公開する。
# 公開も monica-core の取得も GITHUB_TOKEN で足りるので、secret は要らない。
# GitHub Packages は GPG 署名を要求しないので署名もしない。
#
# 移設元は Accel-Hack/monica の .github/workflows/maven-release.yml。変えたのは
# repository 名、単独 pom.xml になったことによる `-f sdk/java/pom.xml` と
# `-DprocessAllModules` の削除、そして tag の prefix。移設元は npm と Maven が同居して
# いたので `maven-v*` で区別していたが、この repository が出す artifact は 1 つなので
# 素の `v*` でよい。
on:
  push:
    tags:
      - "v*"

concurrency:
  group: maven-release
  cancel-in-progress: false

permissions:
  contents: read
  # monica-android をこの repository の GitHub Packages へ出し、monica-core を
  # Accel-Hack/monica-sdk-java の GitHub Packages から取る。
  packages: write

jobs:
  publish:
    name: monica-androidをGitHub Packagesへ公開
    # fork で tag を打っても、その fork の package へ publish しに行かないように。
    if: github.repository == 'Accel-Hack/monica-sdk-android'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: pom.xml
          # server-* input は使わない。setup-java が書く settings.xml は server を 1 つ
          # しか持てないが、この job は monica-android を出す server と monica-core を
          # 読む server の両方が要る。両方を書いた .github/maven-settings.xml を mvn へ
          # 渡す。input と同じく credential 値ではなく environment variable 名を持つので、
          # token は step の env から渡る。

      - name: tag・main・POM versionを検証
        shell: bash
        # ここの mvn は project の依存を解決しないが、settings は deploy step と揃えて
        # おく。将来 goal が増えて monica-core を引いたときに、ここだけ 401 で落ちる
        # 形にしないため。
        env:
          MONICA_PACKAGES_ACTOR: ${{ github.actor }}
          MONICA_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::release tag は main に含まれる commit へ付けてください。"
            exit 1
          }

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release tag は vX.Y.Z 形式にしてください。"
            exit 1
          fi
          pom_version=$(mvn --batch-mode --no-transfer-progress \
            -s .github/maven-settings.xml \
            help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "$pom_version" != "$tag_version-SNAPSHOT" ]]; then
            echo "::error::tag=$tag_version POM=$pom_version。POM を $tag_version-SNAPSHOT へ更新してください。"
            exit 1
          fi

          mvn --batch-mode --no-transfer-progress \
            -s .github/maven-settings.xml \
            org.codehaus.mojo:versions-maven-plugin:2.21.0:set \
            -DnewVersion="$tag_version" -DgenerateBackupPoms=false

      - name: GitHub Packagesへ公開
        run: >-
          mvn --batch-mode --no-transfer-progress
          -s .github/maven-settings.xml deploy
        env:
          # 公開用。job の permissions: packages: write で書き込める。
          MONICA_PUBLISH_ACTOR: ${{ github.actor }}
          MONICA_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # monica-core の解決用。ci.yml と同じ。
          MONICA_PACKAGES_ACTOR: ${{ github.actor }}
          MONICA_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
